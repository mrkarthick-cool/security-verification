        body {

        .p-text { color: var(--blue); font-weight: bold; font-size: 0.8em; }

        .cl { float: right; color: var(--neon); font-size: 28px; cursor: pointer; }
        .bx { 
            background: #050505; border: 1px dashed var(--neon); padding: 15px; 
            color: var(--neon); margin-top: 15px; word-break: break-all; min-height: 50px;
        }
        .bt {

            width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .bt:active { background: #fff; }
        .tg { float: right; font-size: 0.7em; border: 1px solid; padding: 2px 5px; }
