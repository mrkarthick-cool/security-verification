        :root {

            --high-orange: #ff9d00;
            --dark-bg: #0a0b0c;
            --card-bg: #14171a;
            --accent-green: #00ff41;
            --modal-bg: #111;
        }

        body {
            background-color: var(--dark-bg);
            color: #e1e1e1;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        header {
            background: var(--card-bg);
            padding: 20px;
            border-bottom: 3px solid var(--cyber-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-radius: 0 0 10px 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover { border-color: var(--cyber-blue); background: #1c2024; transform: translateY(-3px); }

        .port-num { color: var(--cyber-blue); font-weight: bold; font-family: monospace; }
        
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px);
        }

        .modal-box {
            background: var(--modal-bg);
            margin: 2% auto;
            padding: 25px;
            width: 90%;
            max-width: 700px;
            border: 1px solid var(--cyber-blue);
            border-radius: 12px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 30px; color: #fff; cursor: pointer; }

        .poc-label { color: var(--cyber-blue); font-size: 0.75em; text-transform: uppercase; font-weight: bold; margin-top: 15px; display: block; }
        .poc-content { background: #000; padding: 12px; border-radius: 6px; margin-top: 4px; border-left: 3px solid var(--accent-green); font-family: monospace; font-size: 0.9em; white-space: pre-wrap; }

        .sev-tag { padding: 3px 8px; border-radius: 4px; font-size: 0.7em; font-weight: bold; float: right; text-transform: uppercase; }
        .crit { background: var(--critical-red); color: white; }
        .high { background: var(--high-orange); color: black; }

        .telegram-btn { background: #24A1DE; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; font-size: 0.9em; font-weight: bold; }
    </style>
</head>
